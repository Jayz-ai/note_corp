name: 運営タスク
description: 部署への依頼・社内タスク
title: "[運営] "
labels: ["ops"]
body:
  - type: dropdown
    id: dept
    attributes:
      label: 担当部署
      options: [CEO, COO, 企画部, 制作部, 編集・品質部, マーケティング部, 分析部]
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 内容
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: 期限
      placeholder: "YYYY-MM-DD"
